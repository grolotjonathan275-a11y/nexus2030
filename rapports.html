function fmtA(n){ return Number(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2}); }
function fmtDT(d){ return d ? new Date(d).toLocaleString("fr-FR") : "-"; }

function switchTab(name){
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById("tab-"+name).classList.add("active");
}

async function loadStaffFilter(){
    if(!isPrivileged()) return;
    document.getElementById("detStaffGroup").style.display = "flex";
    document.getElementById("genStaffGroup").style.display = "flex";
    const { data } = await supabaseClient.from("profiles").select("id,full_name,role").order("full_name");
    const roleLabels = {caissier:"Caissier", agent:"Agent", validateur:"Validateur", superviseur:"Superviseur", secretaire:"Secretaire", ceo:"CEO", super_admin:"Super Admin", gestion_banking:"Gestion Banking"};
    const optionsHtml = '<option value="">Tous</option>' + (data||[]).map(s => `<option value="${s.id}">${s.full_name} (${roleLabels[s.role]||s.role})</option>`).join("");

    document.getElementById("genStaff").innerHTML = optionsHtml;
}

function isPrivileged(){
    return ["ceo","super_admin","superviseur","secretaire"].includes(currentUser.role);

function dayRange(dateStr){
    const start = new Date(dateStr + "T00:00:00");
    const end = new Date(dateStr + "T23:59:59.999");
    return { start: start.toISOString(), end: end.toISOString() };
}

async function fetchServiceData(svcKey, dateStr, staffIdOverride){
    const svc = SERVICES[svcKey];
    const { start, end } = dayRange(dateStr);
    let q = supabaseClient.from(svc.table).select("*").gte("created_at", start).lte("created_at", end).order("created_at",{ascending:true});
    q = svc.extraFilter(q);
    if(!isPrivileged()){
        q = q.eq(svc.staffCol, currentUser.id);
    } else if(staffIdOverride){
        q = q.eq(svc.staffCol, staffIdOverride);
    }
    const { data, error } = await q;
    return { data: data || [], error };
}

let lastDetailedData = null;
let lastDetailedSvcKey = null;
let lastDetailedDate = null;
let lastDetailedStaffLabel = "Tous";

function exportDetailedExcel(){
    if(!lastDetailedData || !lastDetailedData.length){
        alert("Effectuez d'abord une recherche avec des resultats avant d'exporter.");
        return;
    }
    const svc = SERVICES[lastDetailedSvcKey];
    const rows = lastDetailedData.map(t => {
        const row = {};
        svc.cols.forEach(c => { row[c.h] = c.v(t); });
        return row;
    });
    const total = lastDetailedData.reduce((s,t) => s + (svc.sumField(t)||0), 0);
    rows.push({});
    const totalRow = {};
    totalRow[svc.cols[0].h] = "TOTAL";
    totalRow[svc.cols[svc.cols.length-1].h] = fmtA(total);
    rows.push(totalRow);

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, svc.label.replace(/[:\\\/\?\*\[\]]/g,"-").substring(0,31));

    const dateStr = new Date(lastDetailedDate).toLocaleDateString("fr-FR").replace(/\//g,"-");
    XLSX.writeFile(wb, `Nexus_${svc.label.replace(/[^a-zA-Z0-9]/g,"_")}_${dateStr}.xlsx`);
}

function printDetailedReport(){
    if(!lastDetailedData || !lastDetailedData.length){
        alert("Effectuez d'abord une recherche avec des resultats avant d'imprimer.");
        return;
    }
    const svc = SERVICES[lastDetailedSvcKey];
    const total = lastDetailedData.reduce((s,t) => s + (svc.sumField(t)||0), 0);

    const tableRows = lastDetailedData.map(t => "<tr>" + svc.cols.map(c=>`<td style="padding:4px 6px;border:1px solid #ccc;font-size:0.75rem">${c.v(t)}</td>`).join("") + "</tr>").join("");

    const printHtml = `
        <div style="text-align:center;margin-bottom:1.5rem;border-bottom:2px solid #000;padding-bottom:1rem">
            <h1 style="font-size:1.4rem">NEXUS CASA DE CAMBIO</h1>
            <p style="font-size:0.9rem">Rapport Detaille - ${svc.label}</p>
            <p style="font-size:0.9rem;font-weight:700">${new Date(lastDetailedDate).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
            <p style="font-size:0.75rem;color:#666">Genere par: ${currentUser.name} (${currentUser.role})</p><p style="font-size:0.75rem;color:#666">Personnel filtre: ${lastDetailedStaffLabel}</p>
        </div>
        <div style="margin-bottom:1.25rem">
            <h3 style="font-size:0.95rem;background:#F1F5F9;padding:0.5rem;border-radius:4px">${svc.label} (${lastDetailedData.length} transaction(s) - Total: ${fmtA(total)})</h3>
            <table style="width:100%;border-collapse:collapse;margin-top:0.35rem">
                <thead><tr>${svc.cols.map(c=>`<th style="padding:4px 6px;border:1px solid #ccc;background:#F8FAFC;font-size:0.72rem;text-align:left">${c.h}</th>`).join("")}</tr></thead>
                <tbody>${tableRows}</tbody>
            </table>
        </div>`;

    document.getElementById("printArea").innerHTML = printHtml;
    window.print();
}

async function loadDetailedReport(){
    const svcKey = document.getElementById("detService").value;
    const dateStr = document.getElementById("detDate").value;
    if(!dateStr){ alert("Selectionnez une date."); return; }

    const svc = SERVICES[svcKey];
    document.getElementById("detTitle").textContent = svc.label + " - " + new Date(dateStr).toLocaleDateString("fr-FR");
    document.getElementById("detBody").innerHTML = "<tr><td style='padding:1.5rem;text-align:center'>Chargement...</td></tr>";

    const staffFilter = isPrivileged() ? document.getElementById("detStaff").value : null;
    const { data, error } = await fetchServiceData(svcKey, dateStr, staffFilter);
    if(error){ document.getElementById("detBody").innerHTML = "<tr><td style='padding:1.5rem;color:red'>Erreur: "+error.message+"</td></tr>"; return; }

    lastDetailedData = data;
    lastDetailedSvcKey = svcKey;
    lastDetailedDate = dateStr;
    lastDetailedStaffLabel = isPrivileged() && staffFilter ? document.getElementById("detStaff").options[document.getElementById("detStaff").selectedIndex].text : "Tous";

    document.getElementById("detCount").textContent = data.length + " transaction(s)";
    document.getElementById("detHead").innerHTML = "<tr>" + svc.cols.map(c=>`<th>${c.h}</th>`).join("") + "</tr>";

    if(!data.length){
        document.getElementById("detBody").innerHTML = "<tr><td colspan='"+svc.cols.length+"' style='padding:1.5rem;text-align:center;color:#94A3B8'>Aucune transaction pour cette date.</td></tr>";
        document.getElementById("detSummary").style.display = "none";
        return;
    }

    document.getElementById("detBody").innerHTML = data.map(t => "<tr>" + svc.cols.map(c=>`<td>${c.v(t)}</td>`).join("") + "</tr>").join("");

    const total = data.reduce((s,t) => s + (svc.sumField(t)||0), 0);
    document.getElementById("detSummary").style.display = "flex";
    document.getElementById("detSummary").innerHTML = `<div>Total transactions: <strong>${data.length}</strong></div><div>Volume total: <strong>${fmtA(total)}</strong></div>`;
}

function exportGeneralExcel(){
    if(!lastGeneralData){
        alert("Generez d'abord un rapport avant d'exporter.");
        return;
    }
    const wb = XLSX.utils.book_new();

    Object.keys(SERVICES).forEach(svcKey => {
        const svc = SERVICES[svcKey];
        const rows = (lastGeneralData[svcKey] || []).map(t => {
            const row = {};
            svc.cols.forEach(c => { row[c.h] = c.v(t); });
            return row;
        });
        if(rows.length === 0){
            rows.push({ Info: "Aucune transaction" });
        }
        const total = (lastGeneralData[svcKey] || []).reduce((s,t) => s + (svc.sumField(t)||0), 0);
        if(rows.length && rows[0].Info === undefined){
            rows.push({});
            const totalRow = {};
            totalRow[svc.cols[0].h] = "TOTAL";
            totalRow[svc.cols[svc.cols.length-1].h] = fmtA(total);
            rows.push(totalRow);
        }
        const ws = XLSX.utils.json_to_sheet(rows);
        const sheetName = svc.label.replace(/[:\\\/\?\*\[\]]/g,"-").substring(0,31);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    const dateStr = new Date(lastGeneralDate).toLocaleDateString("fr-FR").replace(/\//g,"-");
    XLSX.writeFile(wb, `Nexus_Rapport_General_${dateStr}.xlsx`);
}

async function loadGeneralReport(){
    const dateStr = document.getElementById("genDate").value;
    if(!dateStr){ alert("Selectionnez une date."); return; }
    const staffFilter = isPrivileged() ? document.getElementById("genStaff").value : null;
    const staffLabel = staffFilter ? document.getElementById("genStaff").options[document.getElementById("genStaff").selectedIndex].text : "Tous";

    const resultsDiv = document.getElementById("genResults");
    resultsDiv.innerHTML = "<p style='padding:1rem;color:#64748B'>Chargement de tous les services...</p>";

    let printHtml = `
        <div style="text-align:center;margin-bottom:1.5rem;border-bottom:2px solid #000;padding-bottom:1rem">
            <h1 style="font-size:1.4rem">NEXUS CASA DE CAMBIO</h1>
            <p style="font-size:0.9rem">Rapport General d'Activite</p>
            <p style="font-size:0.9rem;font-weight:700">${new Date(dateStr).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
            <p style="font-size:0.75rem;color:#666">Genere par: ${currentUser.name} (${currentUser.role})</p><p style="font-size:0.75rem;color:#666">Personnel filtre: ${staffLabel}</p>
        </div>`;

    let screenHtml = "";
    let grandTotalTxns = 0;

    lastGeneralData = {};
    lastGeneralDate = dateStr;

    for(const svcKey of Object.keys(SERVICES)){
        const svc = SERVICES[svcKey];
    const { data, error } = await fetchServiceData(svcKey, dateStr, staffFilter);
        const rows = data || [];
        lastGeneralData[svcKey] = rows;
        grandTotalTxns += rows.length;

        const total = rows.reduce((s,t) => s + (svc.sumField(t)||0), 0);

        const tableRows = rows.length
            ? rows.map(t => "<tr>" + svc.cols.map(c=>`<td style="padding:4px 6px;border:1px solid #ccc;font-size:0.75rem">${c.v(t)}</td>`).join("") + "</tr>").join("")
            : `<tr><td colspan="${svc.cols.length}" style="padding:6px;text-align:center;color:#999;border:1px solid #ccc">Aucune transaction</td></tr>`;

        const sectionHtml = `
            <div style="margin-bottom:1.25rem">
                <h3 style="font-size:0.95rem;background:#F1F5F9;padding:0.5rem;border-radius:4px">${svc.label} (${rows.length} transaction(s) - Total: ${fmtA(total)})</h3>
                <table style="width:100%;border-collapse:collapse;margin-top:0.35rem">
                    <thead><tr>${svc.cols.map(c=>`<th style="padding:4px 6px;border:1px solid #ccc;background:#F8FAFC;font-size:0.72rem;text-align:left">${c.h}</th>`).join("")}</tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>`;

        printHtml += sectionHtml;
        screenHtml += `<div class="card"><div class="card-header"><h3>${svc.label}</h3><span style="color:#64748B;font-size:0.85rem">${rows.length} txn(s) - ${fmtA(total)}</span></div><div class="table-wrap">${tableRows==="" ? "" : "<table><thead><tr>"+svc.cols.map(c=>`<th>${c.h}</th>`).join("")+"</tr></thead><tbody>"+tableRows+"</tbody></table>"}</div></div>`;
    }

    printHtml += `<div style="margin-top:1rem;border-top:2px solid #000;padding-top:0.75rem;font-weight:700">Total general: ${grandTotalTxns} transaction(s) toutes categories confondues</div>`;

    document.getElementById("printArea").innerHTML = printHtml;
    resultsDiv.innerHTML = screenHtml || "<p style='padding:1rem'>Aucune donnee.</p>";
}

document.addEventListener("DOMContentLoaded", async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){ window.location.href = "login.html"; return; }
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).single();
    if(!profile){ window.location.href = "login.html"; return; }
    currentUser = { id: profile.id, name: profile.full_name, role: profile.role };

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("detDate").value = today;
    document.getElementById("genDate").value = today;

    loadStaffFilter();
});
